# Mutants claimed by the module sheets and the reports (SR-12): each one is a
# defect a security test must catch. scripts/mutants.sh applies them one at a
# time to the working tree (never committed), runs only their tests, checks
# that each listed test FAILS, and restores the file. Run by hand, never by
# scripts/test_all.sh:
#
#   scripts/mutants.sh                  # every mutant
#   scripts/mutants.sh M03 M07          # some of them (by id)
#   scripts/mutants.sh --list
#
# Adding a mutant (CLAUDE.md: every mutant claimed in a sheet is added here):
#   - id: next free "Mnn-short-name"; claim: where the sheet or report claims it;
#   - file: repository path; old: an exact text found ONCE in it (a stale `old`
#     fails tests/test_mutants_manifest.py); new: its replacement;
#   - tests: pytest node ids ("path" or "path::test_function"); EVERY one must
#     have at least one FAILED case under the mutant (a setup ERROR is no kill);
#   - check it: scripts/mutants.sh Mnn  →  "tué".
# TOML literal strings ('...' or '''...''') take the text as is, no escapes.

