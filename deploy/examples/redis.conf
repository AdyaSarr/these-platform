# Example /etc/redis/redis.conf of the platform (docs/DEPLOYMENT.md, Redis).
# Every behaviour noted here is to be checked on the deployed Redis version
# (commands in DEPLOYMENT.md). Redis holds the rate-limit counters, the TOTP
# anti-replay markers (Django cache) and the Celery queue (identifiers only).

# Local only. With Redis on another machine: port 0, tls-port, certificates,
# and REDIS_URL=rediss://... (DEPLOYMENT.md).
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# The password lives in a separate file, root:redis 0640, never in Git nor in
# this file: one line "requirepass <password>" (generated with
# python -c "import secrets;print(secrets.token_urlsafe(32))").
include /etc/redis/these-password.conf

# Persistence of the Celery queue across a restart.
appendonly yes
appendfsync everysec

# Bounded memory (SR-15). volatile-lru evicts only keys with a TTL (the Django
# cache); the Celery queue keys have none and are never evicted: when only they
# are left, writes fail instead (to check: TTL -1 on the _kombu.* keys).
maxmemory 256mb
maxmemory-policy volatile-lru
