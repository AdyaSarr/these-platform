{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Sign in" %}{% endblock %}
{% block content %}
  <h1>{% translate "Sign in" %}</h1>
  <form class="stack" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">{% translate "Sign in" %}</button>
  </form>
{% endblock %}
